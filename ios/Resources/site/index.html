<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/replica_shim.js?v=1"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>远程控车系统 - 登录</title>
    <meta name="description" content="远程控车系统登录页面">
    <meta name="theme-color" content="#05070d">
    <script src="/static/vendor/tailwind.js"></script>
    <style>
        :root {
            --bg0: #05070d;
            --card: rgba(148, 163, 184, .07);
            --card2: rgba(148, 163, 184, .12);
            --border: rgba(148, 163, 184, .15);
            --txt: #e2e8f0;
            --muted: #7d8aa3;
            --faint: #4b5871;
            --cyan: #ff5a52;
            --blue: #ef4444;
            --green: #34d399;
            --amber: #fbbf24;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { color-scheme: dark; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
            background: var(--bg0);
            color: var(--txt);
            min-height: 100vh;
            margin: 0;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(600px 320px at 85% -5%, rgba(255, 90, 82, .10), transparent 60%),
                radial-gradient(700px 380px at -10% 25%, rgba(239, 68, 68, .11), transparent 60%),
                radial-gradient(500px 500px at 50% 115%, rgba(99, 102, 241, .08), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .glass-card {
            background: linear-gradient(165deg, rgba(148, 163, 184, .10), rgba(148, 163, 184, .05));
            border: 1px solid var(--border);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        .logo-badge {
            width: 52px; height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff5a52, #ef4444 60%, #dc2626);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(255, 90, 82, .35);
        }
        .input-wrap {
            display: flex; align-items: center; gap: 10px;
            background: rgba(5, 8, 16, .55);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 0 14px;
            transition: border-color .18s ease, box-shadow .18s ease;
        }
        .input-wrap:focus-within {
            border-color: rgba(255, 90, 82, .55);
            box-shadow: 0 0 0 3px rgba(255, 90, 82, .12);
        }
        .input-wrap svg { flex-shrink: 0; color: var(--faint); transition: color .18s ease; }
        .input-wrap:focus-within svg { color: var(--cyan); }
        .input-wrap input {
            flex: 1; min-width: 0;
            background: transparent;
            border: none; outline: none;
            color: var(--txt);
            font-size: 15px;
            padding: 13px 0;
        }
        .input-wrap input::placeholder { color: var(--faint); }
        .btn-primary {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px; font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #fb923c, #ef4444 70%, #b91c1c);
            box-shadow: 0 8px 22px rgba(220, 38, 38, .4), inset 0 1px 0 rgba(255, 255, 255, .2);
            transition: transform .12s ease, filter .15s ease, opacity .15s ease;
        }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
        .btn-primary:active:not(:disabled) { transform: scale(.98); }
        .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
        .tab-bar {
            display: flex;
            background: rgba(5, 8, 16, .55);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 4px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px; font-weight: 500;
            color: var(--muted);
            transition: all .18s ease;
        }
        .tab-active {
            background: linear-gradient(135deg, #fb923c, #ef4444);
            color: #fff;
            box-shadow: 0 3px 10px rgba(220, 38, 38, .35);
        }
        .code-btn {
            flex-shrink: 0;
            padding: 0 14px;
            border-radius: 12px;
            font-size: 13px; font-weight: 500;
            color: var(--cyan);
            background: rgba(255, 90, 82, .10);
            border: 1px solid rgba(255, 90, 82, .3);
            transition: all .15s ease;
            white-space: nowrap;
            height: 46px;
        }
        .code-btn:hover:not(:disabled) { background: rgba(255, 90, 82, .18); }
        .code-btn:disabled { opacity: .5; cursor: not-allowed; }
        .checkbox {
            width: 16px; height: 16px;
            accent-color: #ff5a52;
            border-radius: 4px;
        }
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255, 255, 255, .3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes carFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
        @keyframes carShadow { 0%, 100% { transform: scaleX(1); opacity: .16; } 50% { transform: scaleX(.9); opacity: .09; } }
        .car-float { animation: carFloat 3.6s ease-in-out infinite; will-change: transform; }
        .car-shadow { width: 62%; height: 10px; margin: -2px auto 0; background: radial-gradient(ellipse at center, rgba(15, 23, 42, .5), transparent 70%); animation: carShadow 3.6s ease-in-out infinite; }
        @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
        .rise { animation: rise .45s cubic-bezier(.32, .72, 0, 1) both; }
        .rise-1 { animation-delay: .05s; }
        .rise-2 { animation-delay: .12s; }
    </style>

</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <!-- 启动骨架屏：避免脚本加载期间白屏（DOMContentLoaded 或 4s 兜底自动移除） -->
    <div id="bootLoader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#f1f5f9">
        <div style="width:34px;height:34px;border-radius:50%;border:3px solid rgba(59,130,246,.18);border-top-color:#3b82f6;animation:btspin .8s linear infinite"></div>
        <p style="font-size:12px;color:#64748b;margin:0">正在加载…</p>
        <style>@keyframes btspin{to{transform:rotate(360deg)}}@media (prefers-color-scheme:dark){#bootLoader{background:#0f172a}#bootLoader p{color:#94a3b8}}</style>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', function () { var b = document.getElementById('bootLoader'); if (b) b.remove(); });
        setTimeout(function () { var b = document.getElementById('bootLoader'); if (b) b.remove(); }, 4000);
    </script>
    <div class="glass-card rounded-3xl w-full max-w-md overflow-hidden relative z-10 rise">

        <div class="pt-8 pb-6 px-6 text-center relative">
            <div class="logo-badge mx-auto mb-4 rise-1 rise">
                <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H8.2c-.8 0-1.5.4-1.9 1.1L4.6 11l-2.1.3C1.6 11.4 1 12.2 1 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
            </div>
            <h1 class="text-xl font-bold mb-1 rise rise-1">远程控车系统</h1>

            <div class="mt-4 rise rise-2">
                <div class="car-float">

                </div>

        <div class="px-6 pb-7">

            <div class="tab-bar mb-6">

                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.9 12.1 20 3m-3 3 3 3"/></svg>
                    控车码登录
                </button>
                <button type="button" onclick="switchTab(2)" id="tabBtn2" class="tab-btn tab-active">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg>

            <div id="tab1" class="tab-content hidden" style="display:none">
                <form id="loginForm" onsubmit="return handleLogin(event)">
                    <div class="mb-4">

                        <div class="input-wrap">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.9Z"/></svg>
                            <input type="tel" id="phone" name="phone" required placeholder="请输入手机号">
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block text-xs font-medium mb-2" style="color:var(--muted)" for="pin">控车码</label>
                        <div class="input-wrap">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                            <input type="password" id="pin" name="pin" required placeholder="请输入控车码">
                        </div>
                    </div>
                    <button type="submit" id="loginBtn" class="btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5M15 12H3"/></svg>
                        登录
                    </button>
                <div style="margin-top:10px;text-align:center">
                    <span style="font-size:11.5px;color:var(--muted)">登录后首次控车会提示设置控车码</span>
                </div>
                </form>

                <a href="/real" style="display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;padding:12px;border-radius:12px;background:linear-gradient(135deg,#ff5a52,#ef4444);color:#fff;font-size:14px;font-weight:600;text-decoration:none;box-shadow:0 8px 22px rgba(255,90,82,.28)">用车联网账号登录 · 真实控车</a>
                <p style="margin:8px 0 0;font-size:11px;text-align:center;color:var(--muted)">收一条长安官方短信验证码即可进入，无需控车码</p>
            </div>

            <div id="tab2" class="tab-content">
                <form id="smsForm" onsubmit="return handleSmsLogin(event)">
                    <div class="mb-4">
                        <label class="block text-xs font-medium mb-2" style="color:var(--muted)" for="smsPhone">手机号</label>
                        <div class="input-wrap">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.9Z"/></svg>
                            <input type="tel" id="smsPhone" name="smsPhone" placeholder="请输入手机号">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-xs font-medium mb-2" style="color:var(--muted)" for="smsPin">控车码</label>
                        <div class="input-wrap">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                            <input type="password" id="smsPin" name="smsPin" placeholder="请输入控车码">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-xs font-medium mb-2" style="color:var(--muted)" for="smsCode">验证码</label>
                        <div class="flex gap-2">
                            <div class="input-wrap flex-1 min-w-0" style="padding:0 0 0 14px">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
                                <input type="text" id="smsCode" name="smsCode" placeholder="验证码" maxlength="6" style="padding-right:0">
                            </div>
                            <button type="button" id="getCodeBtn" onclick="getCode()" class="code-btn">获取验证码</button>
                        </div>
                    </div>
                    <div class="mb-5">
                        <label class="flex items-center gap-2.5 cursor-pointer select-none">
                            <input type="checkbox" id="saveToCloud" class="checkbox" checked>
                            <span class="text-xs" style="color:var(--muted)">保存到云端（多设备同步）</span>
                        </label>
                    </div>
                    <button type="submit" id="smsLoginBtn" class="btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5M15 12H3"/></svg>
                        登录
                    </button>
                </form>
            </div>

            <div class="mt-5 text-center">
                <a href="/guide" class="inline-flex items-center gap-1.5 text-xs transition-colors" style="color:var(--faint)">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
                    <span>使用说明</span>
                </a>

        </div>
    </div>

    <div id="toast" class="fixed top-6 right-6 px-5 py-3 rounded-xl text-white font-medium shadow-lg transform translate-x-[calc(100%+24px)] transition-transform duration-300 z-50 flex items-center">
        <svg class="mr-2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 7"/></svg><span id="toastMsg"></span>
    </div>

    <script>
        (function() {
            var cachedPhone = localStorage.getItem('phone');
            var cachedRefToken = localStorage.getItem('ref_token');
            var cachedPin = localStorage.getItem('pin');
            if (cachedPhone && cachedRefToken && cachedPin) {
                window.location.href = '/user_info?phone=' + encodeURIComponent(cachedPhone) +
                    '&ref_token=' + encodeURIComponent(cachedRefToken) +
                    '&pin=' + encodeURIComponent(cachedPin);
            }
        })();

        /* 恢复自定义桌面图标（iOS 添加到主屏幕用） */
        (function() {
            function apply() {
                var saved = null;
                try { saved = localStorage.getItem('homescreen_icon'); } catch (e) {}
                if (!saved) return;
                document.querySelectorAll('link[rel="apple-touch-icon"], link[rel="icon"]').forEach(function(l) {
                    l.setAttribute('href', saved);
                });
            }
            if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', apply);
            else apply();
        })();

        var SVG_SIGNIN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5M15 12H3"/></svg>';

        function switchTab(n) {
            document.getElementById('tab1').classList.toggle('hidden', n !== 1);
            document.getElementById('tab2').classList.toggle('hidden', n !== 2);
            document.getElementById('tabBtn1').classList.toggle('tab-active', n === 1);
            document.getElementById('tabBtn2').classList.toggle('tab-active', n === 2);
        }

        function showToast(msg, type) {
            var toast = document.getElementById('toast');
            var toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.className = toast.className.replace('translate-x-[calc(100%+24px)]', 'translate-x-0');
            toast.style.background = type === 'error' ? '#DC2626' : '#059669';
            setTimeout(function() {
                toast.className = toast.className.replace('translate-x-0', 'translate-x-[calc(100%+24px)]');
            }, 3000);
        }

        function handleLogin(e) {
            e.preventDefault();
            var phone = document.getElementById('phone').value.trim();
            var pin = document.getElementById('pin').value.trim();
            var btn = document.getElementById('loginBtn');

            if (!phone || !pin) { showToast('请填写完整信息', 'error'); return false; }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>登录中...';

            fetch('/get_user_info?phone=' + encodeURIComponent(phone) + '&pin=' + encodeURIComponent(pin))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.success) throw new Error(data.message || '用户不存在或PIN码错误');
                localStorage.setItem('phone', phone);
                localStorage.setItem('ref_token', data.ref_token);
                localStorage.setItem('pin', data.pin);
                showToast('登录成功', 'success');
                goUserInfo(phone, data.ref_token, data.pin);
            })
            .catch(function(err) { showToast(err.message || '登录失败', 'error'); })
            .finally(function() { btn.disabled = false; btn.innerHTML = SVG_SIGNIN + '登录'; });
            return false;
        }

        var smsCooldown = 0, smsTimer = null;
        function getCode() {
            if (smsCooldown > 0) return;
            var mobile = document.getElementById('smsPhone').value.trim();
            if (!/^1\d{10}$/.test(mobile)) { showToast('请输入 11 位手机号', 'error'); return; }
            var btn = document.getElementById('getCodeBtn');
            btn.disabled = true;
            btn.textContent = '发送中...';
            fetch('/api/real/sms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: mobile })
            })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (!d.success) throw new Error(d.message || '发送失败');
                showToast('验证码已发送，请查收短信', 'success');
                smsCooldown = 60;
                btn.textContent = smsCooldown + 's';
                var timer = setInterval(function() {
                    smsCooldown--;
                    if (smsCooldown <= 0) {
                        clearInterval(timer);
                        btn.disabled = false;
                        btn.textContent = '获取验证码';
                    } else {
                        btn.textContent = smsCooldown + 's';
                    }
                }, 1000);
            })
            .catch(function(err) {
                showToast(err.message || '发送失败', 'error');
                btn.disabled = false;
                btn.textContent = '获取验证码';
            });
        }

        function handleSmsLogin(e) {
            e.preventDefault();
            var mobile = document.getElementById('smsPhone').value.trim();
            var code = document.getElementById('smsCode').value.trim();
            var btn = document.getElementById('smsLoginBtn');
            if (!/^1\d{10}$/.test(mobile)) { showToast('请输入 11 位手机号', 'error'); return false; }
            if (code.length !== 6) { showToast('请输入 6 位短信验证码', 'error'); return false; }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>登录中...';
            fetch('/api/real/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: mobile, code: code })
            })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d && d.need_sms) {
                    var box = document.getElementById('codeBlock');
                    if (box) box.style.display = 'block';
                    var inp = document.getElementById('smsCode');
                    if (inp) inp.focus();
                    throw new Error(d.message || '请先用短信验证码登录一次');
                }
                if (!d.success) throw new Error(d.message || '登录失败');
                var savedPin = '';
                try { savedPin = localStorage.getItem('pin') || ''; } catch (e) {}
                if (!savedPin) {
                    var askPin = prompt('请设置控车码\n（长安引力域/长安汽车 App 里设置的 6 位安全码，控车时使用）', '');
                    if (askPin && /^\d{4,8}$/.test(askPin.trim())) {
                        savedPin = askPin.trim();
                        try { localStorage.setItem('pin', savedPin); } catch (e) {}
                        var pi = document.getElementById('pinInput');
                        if (pi) pi.value = savedPin;
                    }
                }
                try {
                    localStorage.setItem('phone', mobile);
                    if (savedPin) localStorage.setItem('pin', savedPin);
                    localStorage.setItem('ref_token', d.refresh_token || '');
                    localStorage.setItem('replica_real_upstream', '1');
                    if (d.car_name) localStorage.setItem('car_name', d.car_name);
                    if (d.plate) localStorage.setItem('car_plate', d.plate);
                    if (d.car_id) localStorage.setItem('car_id', d.car_id);
                } catch (e2) {}
                showToast('登录成功，正在进入…', 'success');
                setTimeout(function() { location.href = '/user_info'; }, 600);
            })
            .catch(function(err) {
                showToast(err.message || '登录失败', 'error');
                btn.disabled = false;
                btn.textContent = '登录';
            });
            return false;
        }

        function showSmsCode() {
            var box = document.getElementById('codeBlock');
            if (box) box.style.display = 'block';
            var inp = document.getElementById('smsCode');
            if (inp) { inp.focus(); }
            showToast('请输入手机号，点「获取验证码」', 'success');
        }

        function quickLogin() {
            var mobile = document.getElementById('smsPhone').value.trim();
            var pin = document.getElementById('smsPin').value.trim();
            if (!/^1\d{10}$/.test(mobile)) { showToast('请输入 11 位手机号', 'error'); return; }
            if (!pin) { showToast('请输入控车码', 'error'); return; }
            showToast('正在登录…', 'success');
            fetch('/api/real/session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: mobile, pin: pin })
            })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d && d.need_sms) {
                    var cb = document.getElementById('codeBlock');
                    if (cb) cb.style.display = 'block';
                    var inp = document.getElementById('smsCode');
                    if (inp) inp.focus();
                    throw new Error(d.message || '请先用短信验证码登录一次');
                }
                if (!d.success) throw new Error(d.message || '登录失败');
                try {
                    localStorage.setItem('phone', mobile);
                    localStorage.setItem('pin', pin);
                    localStorage.setItem('ref_token', d.refresh_token || '');
                    localStorage.setItem('replica_real_upstream', '1');
                    if (d.car_name) localStorage.setItem('car_name', d.car_name);
                    if (d.plate) localStorage.setItem('car_plate', d.plate);
                    if (d.car_id) localStorage.setItem('car_id', d.car_id);
                } catch (e) {}
                showToast('登录成功，正在进入…', 'success');
                setTimeout(function() { location.href = '/user_info'; }, 600);
            })
            .catch(function(err) { showToast(err.message || '登录失败', 'error'); });
        }


        function goUserInfo(phone, ref, pin) {
            window.location.href = '/user_info?phone=' + encodeURIComponent(phone) +
                '&ref_token=' + encodeURIComponent(ref) +
                '&pin=' + encodeURIComponent(pin);
        }

    </script>
