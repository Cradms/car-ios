workflows:
  # ---------------- 未签名（先出 ipa，自己签） ----------------
  ios-unsigned:
    name: CarApp · 未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.yg.carapp
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: 装 XcodeGen
        script: |
          brew install xcodegen

      - name: 生成 Xcode 工程
        script: |
          cd ios
          xcodegen generate
          ls -la

      - name: 编译（不签名）
        script: |
          set -eo pipefail
          cd ios
          xcodebuild \
            -project CarApp.xcodeproj \
            -scheme CarApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/build.log | tail -50
          echo "---- 产物扫描 ----"
          find build -name "*.app" -maxdepth 5 -print

      - name: 打包 IPA
        script: |
          set -e
          cd ios
          APP=$(find build -name "*.app" -maxdepth 5 -type d | head -1)
          if [ -z "$APP" ]; then
            echo "❌ 没找到 .app，编译可能失败。build 目录结构："
            find build -maxdepth 4 -type d | head -30
            echo "---- 编译日志尾部 ----"
            tail -60 /tmp/build.log || true
            exit 1
          fi
          echo "找到产物：$APP"
          du -sh "$APP"
          rm -rf Payload CarApp-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ls -la Payload/
          zip -qry CarApp-unsigned.ipa Payload
          echo "---- ipa 内容 ----"
          unzip -l CarApp-unsigned.ipa | head -8
          ls -lh CarApp-unsigned.ipa
    artifacts:
      - ios/CarApp-unsigned.ipa

  # ---------------- 已签名（上传 p12 + profile 后用这个） ----------------
  ios-signed:
    name: CarApp · 已签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.yg.carapp
      vars:
        BUNDLE_ID: com.yg.carapp
    scripts:
      - name: 装 XcodeGen
        script: brew install xcodegen

      - name: 生成工程
        script: |
          cd ios
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: .*/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" project.yml
          xcodegen generate

      - name: 应用签名配置
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: 归档
        script: |
          cd ios
          xcodebuild archive \
            -project CarApp.xcodeproj \
            -scheme CarApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/CarApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            | tail -30

      - name: 导出 IPA
        script: |
          cd ios
          python3 ../ios/gen_export_options.py "$BUNDLE_ID" "$(echo $CM_TEAM_ID)" ad-hoc ""
          xcodebuild -exportArchive \
            -archivePath $PWD/build/CarApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build/ipa \
            | tail -20
          ls -lh build/ipa
    artifacts:
      - ios/build/ipa/*.ipa
