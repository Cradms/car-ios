# /etc/nginx/sites-available/car.example.com
# 反代到本机 8080 的复刻服务，顺便做 HTTPS 与压缩
# 证书用 certbot 自动签发： certbot --nginx -d car.example.com

server {
    listen 80;
    listen [::]:80;
    server_name car.example.com;

    # certbot 会把它改成 301 到 https
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 车模 .bin 有 5.8MB、圈子图片上传，放开上传体积
    client_max_body_size 30m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/octet-stream image/svg+xml;

    # 车模与贴图可长缓存，其余不缓存（接口都带 no-store）
    location ~* ^/static/(car3d|vendor/myth)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
