name: Build IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Sync web assets
        run: chmod +x ios/sync_site.sh && ./ios/sync_site.sh

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      # ---------- 检测是否配置了证书 ----------
      - name: Check signing secrets
        id: sign
        env:
          P12: ${{ secrets.P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "检测到签名证书，将产出已签名 ipa"
          else
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "未配置证书，将产出未签名 ipa"
          fi

      # ---------- 有证书就签名，没有就跳过 ----------
      - name: Import signing certificate
        if: steps.sign.outputs.signed == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          echo "$P12_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
          security create-keychain -p "" $KEYCHAIN
          security set-keychain-settings -lut 3600 $KEYCHAIN
          security unlock-keychain -p "" $KEYCHAIN
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN login.keychain
          echo "证书已导入"

          if [ -n "$PROFILE_BASE64" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
            echo "描述文件已导入"
          fi

      - name: Build archive (signed)
        if: steps.sign.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          METHOD: ${{ secrets.EXPORT_METHOD }}
        run: |
          set -e
          cd ios
          if [ -n "$BUNDLE_ID" ]; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: .*/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" project.yml
            xcodegen generate
          fi

          # 从 mobileprovision 读出真实 profile 名（ExportOptions 里要的是这个名字）
          PROF_NAME=""
          PB=~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          if [ -f "$PB" ]; then
            PROF_NAME=$(security cms -D -i "$PB" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin)
            echo "profile 名称：$PROF_NAME"
          fi

          python3 ../ios/gen_export_options.py "$BUNDLE_ID" "$TEAM_ID" "${METHOD:-ad-hoc}" "$PROF_NAME"


          xcodebuild archive \
            -project CarApp.xcodeproj \
            -scheme CarApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/CarApp.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            | tail -30

          mkdir -p build/ipa
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/CarApp.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build/ipa" \
            | tail -20
          ls -lh build/ipa

      # ---------- 没证书：编译未签名 ipa ----------
      - name: Build unsigned
        if: steps.sign.outputs.signed == 'false'
        run: |
          cd ios
          xcodebuild \
            -project CarApp.xcodeproj \
            -scheme CarApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -30
          mkdir -p build/ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CarApp.app Payload/
          zip -qry build/ipa/CarApp-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CarApp-ipa
          path: ios/build/ipa/*.ipa
          retention-days: 30
